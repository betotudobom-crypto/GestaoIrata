<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechOcean | AASJ - Gestão Integrada de Acesso por Cordas</title>
  <link rel="icon" href="assets/emblema.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Tipografia: Barlow Semi Condensed (títulos e números), Barlow (texto) e IBM Plex Mono (TAGs e registros) -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Barlow', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Barlow Semi Condensed"', 'Barlow', 'ui-sans-serif', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            // Paleta da marca TechOcean | AASJ (azul do emblema + azul "OCEAN" do logotipo)
            brand: { 50: '#eef6fc', 100: '#d8eaf8', 200: '#b4d6f1', 300: '#7ab6e0', 400: '#4692cc', 500: '#1f6fb5', 600: '#0b5299', 700: '#06387d', 800: '#062f64', 900: '#062449', 950: '#041a35' },
            ink: '#2f5164'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@8.1.3/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@1.82.0/dist/umd/lucide.min.js"></script>

  <style>
    /* Barlow: visual industrial/offshore. Títulos e números em Barlow Semi Condensed */
    body { font-size: 15px; }
    h1, h2, h3, h4, .font-display, .text-2xl, .text-3xl, .text-4xl {
      font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif;
      letter-spacing: 0.002em;
    }
    h1, h2, .text-2xl, .text-3xl, .text-4xl { font-weight: 700; }
    h3, h4 { font-weight: 600; font-size: 1.02em; }
    /* Cabeçalhos de tabela em caixa alta com respiro, como no "SERVIÇOS INDUSTRIAIS" do logo */
    th { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 12px !important; letter-spacing: 0.09em !important; }
    .font-mono { letter-spacing: -0.01em; }
    /* Dias fora do período de embarque na grade de horas */
    .bg-hatch { background: repeating-linear-gradient(135deg, rgba(148,163,184,.14) 0 4px, transparent 4px 8px); }
    @media print {
      body * { visibility: hidden; }
      #modal-auditoria, #modal-auditoria * { visibility: visible; }
      #modal-auditoria { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; border: none; }
      .print-hidden { display: none !important; }
    }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(148, 163, 184, 0.6); }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.98) } to { opacity: 1; transform: none } }
    @keyframes slide-in { from { transform: translateX(-100%) } to { transform: none } }
    .anim-fade { animation: fade-in .18s ease-out both; }
    .anim-pop { animation: pop-in .22s cubic-bezier(.2,.8,.2,1) both; }
    .anim-slide { animation: slide-in .22s cubic-bezier(.2,.8,.2,1) both; }
    .bg-grid {
      background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    @media (prefers-reduced-motion: reduce) { .anim-fade, .anim-pop, .anim-slide { animation: none; } }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200 min-h-screen font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Campo de texto em foco? (atalhos de letra não devem disparar enquanto o usuário digita)
    const digitando = (el) => el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable);

    /* ---------- Componentes de interface ---------- */

    function Icon({ name, className = "w-5 h-5" }) {
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name, className]);
      // A key força o React a recriar o ícone quando o nome muda (o lucide troca o <i> por <svg>).
      return <span key={name + className} className="inline-flex shrink-0"><i data-lucide={name} className={className}></i></span>;
    }

    const inputCls = "w-full h-11 px-3.5 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 shadow-sm shadow-slate-900/[0.03] focus:outline-none focus:ring-4 focus:ring-brand-500/15 focus:border-brand-500 transition disabled:opacity-60";
    const textareaCls = inputCls.replace('h-11', 'min-h-[110px] py-3') + " resize-y";

    const btnVariants = {
      primary: "bg-brand-600 hover:bg-brand-700 text-white shadow-sm shadow-brand-600/25",
      danger: "bg-red-600 hover:bg-red-700 text-white shadow-sm shadow-red-600/25",
      purple: "bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm shadow-indigo-600/25",
      outline: "border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200",
      ghost: "text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800",
      soft: "bg-brand-50 dark:bg-brand-500/10 text-brand-700 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-brand-500/20",
      softDanger: "bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-300 hover:bg-red-100 dark:hover:bg-red-500/20",
    };
    const btnSizes = { sm: "h-8 px-3 text-xs gap-1.5", md: "h-10 px-4 text-sm gap-2", lg: "h-11 px-5 text-sm gap-2" };

    function Btn({ variant = 'primary', size = 'md', icon, className = '', children, ...props }) {
      return (
        <button {...props} className={`inline-flex items-center justify-center font-semibold rounded-xl transition active:scale-[.98] focus:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:opacity-50 ${btnVariants[variant]} ${btnSizes[size]} ${className}`}>
          {icon && <Icon name={icon} className={size === 'sm' ? 'w-3.5 h-3.5' : 'w-4 h-4'} />}
          {children}
        </button>
      );
    }

    function Card({ className = '', children, ...props }) {
      return <div {...props} className={`bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-sm shadow-slate-900/[0.03] ${className}`}>{children}</div>;
    }

    function Field({ label, children }) {
      return (
        <label className="block">
          <span className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">{label}</span>
          {children}
        </label>
      );
    }

    const badgeTones = {
      emerald: "bg-brand-50 text-brand-700 ring-brand-600/15 dark:bg-brand-500/10 dark:text-brand-300 dark:ring-brand-400/20",
      green: "bg-green-50 text-green-700 ring-green-600/15 dark:bg-green-500/10 dark:text-green-300 dark:ring-green-400/20",
      rose: "bg-red-50 text-red-700 ring-red-600/15 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-400/20",
      amber: "bg-amber-50 text-amber-700 ring-amber-600/20 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-400/20",
      violet: "bg-indigo-50 text-indigo-700 ring-indigo-600/15 dark:bg-indigo-500/10 dark:text-indigo-300 dark:ring-indigo-400/20",
      sky: "bg-sky-50 text-sky-700 ring-sky-600/15 dark:bg-sky-500/10 dark:text-sky-300 dark:ring-sky-400/20",
      slate: "bg-slate-100 text-slate-600 ring-slate-500/15 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-400/20",
    };
    function Badge({ tone = 'slate', dot, className = '', children }) {
      return (
        <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-semibold ring-1 ring-inset whitespace-nowrap ${badgeTones[tone]} ${className}`}>
          {dot && <span className="w-1.5 h-1.5 rounded-full bg-current opacity-80"></span>}
          {children}
        </span>
      );
    }

    function Avatar({ nome = '', tone = 'emerald', size = 'md' }) {
      const iniciais = nome.split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
      const tones = {
        emerald: 'bg-brand-100 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300',
        rose: 'bg-red-100 text-red-700 dark:bg-red-500/15 dark:text-red-300',
        violet: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300',
        slate: 'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200',
      };
      const sizes = { sm: 'w-8 h-8 text-[11px]', md: 'w-10 h-10 text-xs' };
      return <div className={`${sizes[size]} ${tones[tone]} rounded-full grid place-items-center font-bold shrink-0`}>{iniciais}</div>;
    }

    function EmptyState({ icon = 'inbox', title, text }) {
      return (
        <div className="py-12 px-6 text-center">
          <div className="mx-auto w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 grid place-items-center mb-3">
            <Icon name={icon} className="w-6 h-6" />
          </div>
          <p className="text-sm font-semibold text-slate-700 dark:text-slate-200">{title}</p>
          {text && <p className="text-xs text-slate-500 mt-1">{text}</p>}
        </div>
      );
    }

    function Modal({ title, subtitle, icon = 'file-plus', tone = 'emerald', size = 'sm', onClose, children }) {
      const tones = {
        emerald: 'bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400',
        rose: 'bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400',
        violet: 'bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400',
      };
      // Teclado: foca o primeiro campo ao abrir, Esc fecha (tratado no App) e Tab fica preso dentro da janela
      const caixaRef = useRef(null);
      useEffect(() => {
        const el = caixaRef.current; if (!el) return;
        const anterior = document.activeElement;
        const primeiro = el.querySelector('input:not([type=hidden]):not([disabled]), select, textarea') || el.querySelector('button[type=submit]');
        setTimeout(() => primeiro?.focus(), 30);
        return () => { if (anterior && document.contains(anterior)) anterior.focus?.(); };
      }, []);
      const prenderTab = (e) => {
        if (e.key !== 'Tab') return;
        const focaveis = [...caixaRef.current.querySelectorAll('button:not([disabled]), input:not([disabled]):not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
        if (!focaveis.length) return;
        const [primeiro, ultimo] = [focaveis[0], focaveis[focaveis.length - 1]];
        if (e.shiftKey && document.activeElement === primeiro) { e.preventDefault(); ultimo.focus(); }
        else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primeiro.focus(); }
      };
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/50 backdrop-blur-sm anim-fade" onKeyDown={prenderTab}>
          <div ref={caixaRef} role="dialog" aria-modal="true" aria-label={title} className={`w-full ${size === 'md' ? 'sm:max-w-lg' : 'sm:max-w-md'} max-h-[92vh] overflow-y-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-t-3xl sm:rounded-2xl shadow-2xl anim-pop`}>
            <div className="flex items-start gap-3 p-5 sm:p-6 pb-0 sm:pb-0">
              <div className={`p-2.5 rounded-xl ${tones[tone]}`}><Icon name={icon} className="w-5 h-5" /></div>
              <div className="flex-1 min-w-0">
                <h3 className="font-semibold text-base text-slate-900 dark:text-white">{title}</h3>
                {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
              </div>
              <button type="button" onClick={onClose} aria-label="Fechar" className="p-1.5 -m-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            <div className="p-5 sm:p-6">{children}</div>
          </div>
        </div>
      );
    }

    function ModalActions({ onCancel, submitLabel, variant = 'primary' }) {
      return (
        <div className="flex flex-col-reverse sm:flex-row gap-2 pt-3">
          <Btn type="button" variant="outline" size="lg" className="w-full sm:w-auto sm:flex-1" onClick={onCancel}>Cancelar</Btn>
          <Btn type="submit" variant={variant} size="lg" className="w-full sm:w-auto sm:flex-1">{submitLabel}</Btn>
        </div>
      );
    }

    const thCls = "px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-200/80 dark:border-slate-800 whitespace-nowrap";
    const tdCls = "px-4 py-3.5 whitespace-nowrap";

    /* ---------- Aplicação ---------- */

    // Limite máximo de horas por dia em acesso por cordas
    const LIMITE_HORAS_DIA = 8;   // máximo de horas EM ACESSO (corda) por dia
    const LIMITE_TOTAL_DIA = 12;  // máximo de horas com acesso + sem acesso no mesmo dia

    // Unidades (plataformas) iniciais — o gestor cadastra novas em "Equipe e unidades"
    const UNIDADES_INICIAIS = ['POLVO A', 'BRAVO', 'P-50'];

    // Itens verificados no checklist diário (CL-01)
    const ITENS_CHECKLIST = [
      ['epi', 'EPIs e cinturões inspecionados'],
      ['ancoragem', 'Ancoragens e linhas verificadas'],
      ['resgate', 'Plano de resgate definido'],
      ['isolamento', 'Área abaixo isolada e sinalizada'],
      ['comunicacao', 'Comunicação por rádio testada'],
      ['clima', 'Condições de vento e clima OK'],
    ];
    const checklistCompleto = () => Object.fromEntries(ITENS_CHECKLIST.map(([k]) => [k, true]));
    const conformidadeCL = (c) => { const ok = ITENS_CHECKLIST.filter(([k]) => c.itens?.[k]).length; return { ok, total: ITENS_CHECKLIST.length, pct: Math.round(ok / ITENS_CHECKLIST.length * 100) }; };

    // Critérios da avaliação comportamental (FO-41), nota de 0 a 10 cada (total 100)
    const CRITERIOS_FO41 = [
      'Cumprimento das normas de segurança', 'Uso correto de EPIs', 'Técnica em corda', 'Cuidado com equipamentos', 'Trabalho em equipe',
      'Comunicação', 'Disciplina e pontualidade', 'Organização do posto', 'Proatividade', 'Qualidade da execução',
    ];
    const somaNotas = (notas) => notas.reduce((a, b) => a + Number(b || 0), 0);
    const toneNota = (soma) => soma >= 80 ? 'green' : soma >= 60 ? 'amber' : 'rose';

    // Relatório de danos (RL-32)
    const ACOES_DANO = { substituir: 'Substituição do equipamento', inspecao: 'Inspeção / manutenção', registro: 'Apenas registro' };
    const URGENCIAS = {
      parada: ['Parou a atividade', 'rose', 'Sem o equipamento a equipe não trabalha'],
      urgente: ['Urgente', 'amber', 'Precisa trocar logo, mas há alternativa'],
      normal: ['Pode aguardar', 'slate', 'Pode seguir no próximo envio normal'],
    };
    const ETAPAS_DANO = {
      reportado: ['Aguardando ciência', 'amber'],
      ciente: ['Aguardando decisão', 'sky'],
      troca_aprovada: ['Troca aprovada · a enviar', 'violet'],
      enviado: ['Substituto a caminho', 'violet'],
      inspecao: ['Em inspeção', 'amber'],
      encerrado: ['Encerrado', 'green'],
    };
    const PASSOS_TROCA = ['Reportado', 'Ciente', 'Troca aprovada', 'Enviado', 'Recebido'];
    const passoTroca = (d) => ({ reportado: 0, ciente: 1, troca_aprovada: 2, enviado: 3 }[d.etapa] ?? (d.resultado === 'Substituído' ? 4 : 1));

    // Período de embarque: "01/03/26 a 15/03/26" e duração em dias
    const fmtData = (iso) => { if (!iso) return ''; const [a, m, d] = iso.split('-'); return `${d}/${m}/${a.slice(2)}`; };
    const diasPeriodo = (ini, fim) => ini && fim ? Math.round((new Date(fim) - new Date(ini)) / 86400000) + 1 : 0;
    const fmtPeriodo = (lb) => lb.embarqueInicio && lb.embarqueFim ? `${fmtData(lb.embarqueInicio)} a ${fmtData(lb.embarqueFim)}` : 'Período não informado';

    // Horas do logbook guardadas por data real: { '2026-03-01': 8, ... }
    const horasLogbook = (lb) => Object.values(lb.horas || {}).reduce((a, b) => a + b, 0);          // horas COM acesso
    const horasSemLogbook = (lb) => Object.values(lb.horasSem || {}).reduce((a, b) => a + b, 0);    // horas SEM acesso
    const diasLogbook = (lb) => Object.values(lb.horas || {}).filter(v => v > 0).length;
    const DIAS_SEMANA = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
    const addDias = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
    const datasEntre = (ini, fim) => { const out = []; if (!ini || !fim || fim < ini) return out; for (let d = ini; d <= fim && out.length < 120; d = addDias(d, 1)) out.push(d); return out; };
    const dentroPeriodo = (lb, iso) => !!lb.embarqueInicio && iso >= lb.embarqueInicio && iso <= lb.embarqueFim;
    const diaSemana = (iso) => DIAS_SEMANA[new Date(iso + 'T00:00:00Z').getUTCDay()];
    // Datas cobertas por um conjunto de logbooks (do primeiro embarque ao último desembarque)
    const datasDosLogbooks = (lbs) => { const com = lbs.filter(l => l.embarqueInicio && l.embarqueFim); if (!com.length) return []; return datasEntre(com.map(l => l.embarqueInicio).sort()[0], com.map(l => l.embarqueFim).sort().slice(-1)[0]); };
    const confirmar = (msg) => window.confirm(msg);

    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [menuAberto, setMenuAberto] = useState(false);

      const [viewAuth, setViewAuth] = useState('login');
      const [usuarioLogado, setUsuarioLogado] = useState(null);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginSenha, setLoginSenha] = useState('');
      const [erroAuth, setErroAuth] = useState('');
      const [sucessoAuth, setSucessoAuth] = useState('');

      const [novoCadastro, setNovoCadastro] = useState({ nome: '', email: '', registro: '', validadeIrata: '', senha: '' });

      const [usuariosCadastrados, setUsuariosCadastrados] = useState([
        { id: 1, nome: 'Gestor Operacional', email: 'gestor@aasj.com', perfil: 'GESTOR', senha: '123', status: 'APROVADO' },
        { id: 2, nome: 'Herbert Aquino', email: 'herbert@aasj.com', perfil: 'SUPERVISOR', registro: 'IRATA-38910', validadeIrata: '2026-11-20', senha: '123', status: 'APROVADO' },
        { id: 3, nome: 'Anselmo de Jesus', email: 'anselmo@aasj.com', perfil: 'SUPERVISOR', registro: 'IRATA-31042', validadeIrata: '2025-05-15', senha: '123', status: 'APROVADO' }
      ]);

      const [activeTab, setActiveTab] = useState('painel');
      const [campanha] = useState({ cliente: 'PRIO', unidade: 'POLVO A', dataEmissao: '2026-03-12', periodoEmbarque: '01/03/26 a 15/03/26', liderConstrucao: 'Felipe Moraes' });
      const [unidades, setUnidades] = useState(UNIDADES_INICIAIS);
      const [novaUnidade, setNovaUnidade] = useState('');
      const [erroUnidade, setErroUnidade] = useState('');
      const unidadePadrao = () => unidades.includes(campanha.unidade) ? campanha.unidade : (unidades[0] || '');

      // Cadastro de novo colaborador (feito pelo N3 direto dos formulários)
      const novoColabVazio = { nome: '', nivel: 'N1', funcao: '', registro: '', validadeIrata: '' };
      const [modalColab, setModalColab] = useState(null); // { permitirN3, onCriado }
      const [novoColab, setNovoColab] = useState(novoColabVazio);
      const [erroColab, setErroColab] = useState('');

      const [colaboradores, setColaboradores] = useState([
        { id: 1, nome: 'Anselmo de Jesus', nivel: 'N3', funcao: 'Supervisor IRATA N3', registro: 'IRATA-31042', statusCert: 'Regular' },
        { id: 2, nome: 'Herbert Aquino', nivel: 'N3', funcao: 'Supervisor IRATA N3', registro: 'IRATA-38910', statusCert: 'Regular' },
        { id: 3, nome: 'Igor das Neves', nivel: 'N2', funcao: 'Pintor Escadista', registro: 'IRATA-42109', statusCert: 'Regular' },
        { id: 4, nome: 'Jhonny Alves', nivel: 'N1', funcao: 'Pintor Escadista', registro: 'IRATA-48190', statusCert: 'Regular' },
      ]);
      const supervisoresN3List = usuariosCadastrados.filter(u => u.perfil === 'SUPERVISOR' && u.status === 'APROVADO');

      const [equipamentos, setEquipamentos] = useState([

          avisar('Equipamento condenado', `${usuarioLogado.nome} condenou o equipamento (sem reposição).${decisao.obs ? ` ${decisao.obs}` : ''}`);
        } else if (decisao.tipo === 'recusar') {
          if (!decisao.obs.trim()) { setErroDecisao('Escreva a justificativa da recusa.'); return; }
          setStatusEquip(d.equipamentoTag, 'Operacional');
          atualizarDano(d.id, { ...base, etapa: 'encerrado', resultado: 'Recusado', status: 'Liberado', obsGestor: decisao.obs, encerradoEm: agoraISO() }, 'Troca recusada', decisao.obs);
          avisar('Troca recusada', `${usuarioLogado.nome} recusou a troca e liberou o equipamento: ${decisao.obs}`, 'dano');
        }
        marcarNotifsDanoLidas(d.id, 'GESTOR');
        setDecisao(null);
      };

      // Gestor: substituto despachado
      const marcarEnviado = (d) => {
        atualizarDano(d.id, { etapa: 'enviado', enviadoEm: agoraISO() }, 'Substituto enviado', d.substituto?.previsao ? `Previsão ${d.substituto.previsao}` : '');
        notificar(d.supervisorN3, { tipo: 'info', danoId: d.id, titulo: `Substituto enviado · ${d.equipamentoTag}`, texto: `${d.substituto?.equipamento} ${d.substituto?.tag} foi enviado. Confirme o recebimento quando chegar.` });
      };

      // Gestor: resultado da inspeção aprovado → volta a operar
      const liberarAposInspecao = (d) => {
        setStatusEquip(d.equipamentoTag, 'Operacional');
        atualizarDano(d.id, { etapa: 'encerrado', resultado: 'Liberado após inspeção', status: 'Liberado', encerradoEm: agoraISO() }, 'Aprovado na inspeção', 'Equipamento liberado para uso');
        notificar(d.supervisorN3, { tipo: 'ciente', danoId: d.id, titulo: `Liberado após inspeção · ${d.equipamentoTag}`, texto: `${usuarioLogado.nome} aprovou o equipamento na inspeção. Ele voltou ao inventário operacional.` });
      };

      // Supervisor: confirma que recebeu o substituto → inventário é atualizado e o caso é encerrado
      const confirmarRecebimento = (d) => {
        const s = d.substituto;
        setEquipamentos(prev => [...prev.map(eq => eq.tag === d.equipamentoTag ? { ...eq, status: 'CONDENADO' } : eq),
          { id: Date.now(), equipamento: s.equipamento, fabricante: s.fabricante, tag: s.tag, kit: d.kit || '', status: 'Operacional', unidade: (prev.find(eq => eq.tag === d.equipamentoTag) || {}).unidade || unidadePadrao() }]);
        atualizarDano(d.id, { etapa: 'encerrado', resultado: 'Substituído', status: 'Substituído', recebidoEm: agoraISO(), encerradoEm: agoraISO() }, 'Substituto recebido', `${s.tag} incluído no kit ${d.kit || '—'}; ${d.equipamentoTag} baixado como condenado`);
        marcarNotifsDanoLidas(d.id, usuarioLogado.nome);
        notificar('GESTOR', { tipo: 'ciente', danoId: d.id, titulo: `Troca concluída · ${d.equipamentoTag}`, texto: `${usuarioLogado.nome} confirmou o recebimento de ${s.equipamento} ${s.tag}. Caso encerrado.` });
      };

      const liberarQuarentena = (tag) => {
        setStatusEquip(tag, 'Operacional');
        danosReports.filter(d => d.equipamentoTag === tag && d.etapa !== 'encerrado').forEach(d =>
          atualizarDano(d.id, { etapa: 'encerrado', resultado: 'Liberado (quarentena)', status: 'Liberado', ciente: true, encerradoEm: agoraISO() }, 'Liberado da quarentena pelo gestor'));
      };

      /* FO-41: criar, editar e excluir */
      const abrirNovoFO41 = () => { setEditFO41Id(null); setNovaAvaliacao(novaAvaliacaoVazia()); setShowModalFO41(true); };
      const abrirEditarFO41 = (av) => { setEditFO41Id(av.id); setNovaAvaliacao({ ...novaAvaliacaoVazia(), ...av, notas: av.notas ? [...av.notas] : novaAvaliacaoVazia().notas }); setShowModalFO41(true); };
      const submitFO41 = (e) => {
        e.preventDefault();
        const colab = colaboradores.find(c => c.nome === novaAvaliacao.colaborador);
        const notas = novaAvaliacao.notas.map(n => Math.max(0, Math.min(10, Number(n) || 0)));
        const soma = somaNotas(notas);
        if (editFO41Id) setAvaliacoes(avaliacoes.map(av => av.id === editFO41Id ? { ...av, ...novaAvaliacao, notas, colaborador: colab.nome, funcao: colab.funcao, soma } : av));
        else setAvaliacoes([...avaliacoes, { id: Date.now(), supervisorN3: usuarioLogado.nome, ...novaAvaliacao, notas, colaborador: colab.nome, funcao: colab.funcao, soma }]);
        setShowModalFO41(false); setEditFO41Id(null);
      };
      const excluirFO41 = (av) => { if (confirmar(`Excluir a avaliação de ${av.colaborador}?`)) setAvaliacoes(avaliacoes.filter(x => x.id !== av.id)); };
      const setNota = (i, v) => { const notas = [...novaAvaliacao.notas]; notas[i] = v; setNovaAvaliacao({ ...novaAvaliacao, notas }); };

      const filtrarItemOperacional = (item) => usuarioLogado?.perfil === 'GESTOR'
        ? (!filtroDashboardSupervisor || item.supervisorN3 === filtroDashboardSupervisor) && (!filtroUnidade || !('unidade' in item) || item.unidade === filtroUnidade)
        : item.supervisorN3 === usuarioLogado?.nome;

      atalhosRef.current = { logado: false, camadas: [] };

      /* ---------- TELA DE LOGIN / CADASTRO ---------- */
      if (!usuarioLogado) {
        const trocarView = (v) => { setViewAuth(v); setErroAuth(''); setSucessoAuth(''); };
        return (
          <div className="min-h-screen grid lg:grid-cols-2 bg-white dark:bg-slate-950">
            {/* Painel da marca */}
            <div className="relative hidden lg:flex flex-col justify-between p-12 overflow-hidden bg-gradient-to-br from-brand-700 via-brand-800 to-brand-950 text-white">
              <div className="absolute inset-0 bg-grid [mask-image:radial-gradient(ellipse_at_top_left,black,transparent_70%)]"></div>
              <img src="assets/emblema.jpg" alt="" aria-hidden="true" className="absolute -bottom-24 -right-24 w-[26rem] h-[26rem] rounded-full object-cover opacity-30 ring-1 ring-white/10" />

              <div className="relative flex items-center gap-4">
                <img src="assets/emblema.jpg" alt="Emblema TechOcean | AASJ" className="w-14 h-14 rounded-full object-cover ring-2 ring-white/20 shadow-xl shadow-black/30" />
                <div>
                  <p className="font-display font-bold tracking-wide">TECH<span className="text-brand-300">OCEAN</span> <span className="text-red-500">|</span> AASJ</p>
                  <p className="text-xs tracking-[0.2em] uppercase text-brand-100/70">Serviços Industriais</p>
                </div>
              </div>

              <div className="relative max-w-md">
                <h2 className="text-4xl font-bold tracking-tight leading-tight">Acesso por cordas com segurança e conformidade.</h2>
                <div className="mt-5 h-1 w-16 rounded-full bg-red-600"></div>
                <p className="mt-4 text-brand-50/70 text-sm leading-relaxed">Logbooks, checklists de PT, custódia de EPIs e quarentena de equipamentos em um só lugar, para operações offshore.</p>
                <ul className="mt-8 space-y-3 text-sm">
                  {[['clock','Logbook de horas em corda (FO-45)'],['clipboard-check','Checklist diário e PTs (CL-01)'],['shield-alert','Danos e quarentena automática (RL-32)']].map(([ic, txt]) => (
                    <li key={ic} className="flex items-center gap-3 text-brand-50/90">
                      <span className="p-1.5 rounded-lg bg-white/10 ring-1 ring-white/15"><Icon name={ic} className="w-4 h-4" /></span>{txt}
                    </li>
                  ))}
                </ul>
              </div>

              <p className="relative text-xs text-brand-100/50">Plataforma Offshore de Acesso por Cordas • IRATA & PRIO</p>
            </div>

            {/* Formulário */}
            <div className="flex items-center justify-center p-6 sm:p-10 bg-white dark:bg-slate-950">
              <div className="w-full max-w-sm anim-pop">
                <div className="mb-8 inline-flex rounded-xl dark:bg-white dark:px-3 dark:py-2">
                  <img src="assets/logo-horizontal.png" alt="TechOcean | AASJ Serviços Industriais" className="h-14 w-auto" />
                </div>

                <h1 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                  {viewAuth === 'login' ? 'Entrar na plataforma' : 'Solicitar cadastro'}
                </h1>
                <p className="text-sm text-slate-500 mt-1.5 mb-7">
                  {viewAuth === 'login' ? 'Use seu e-mail profissional para continuar.' : 'Cadastro de Supervisor N3, sujeito à aprovação do Gestor.'}
                </p>

                {erroAuth && <div className="mb-5 flex items-start gap-2 p-3 bg-red-50 dark:bg-red-500/10 ring-1 ring-inset ring-red-200 dark:ring-red-500/20 text-red-700 dark:text-red-300 text-sm rounded-xl anim-fade"><Icon name="alert-circle" className="w-4 h-4 mt-0.5" />{erroAuth}</div>}
                {sucessoAuth && <div className="mb-5 flex items-start gap-2 p-3 bg-brand-50 dark:bg-brand-500/10 ring-1 ring-inset ring-brand-200 dark:ring-brand-500/20 text-brand-700 dark:text-brand-300 text-sm rounded-xl anim-fade"><Icon name="check-circle-2" className="w-4 h-4 mt-0.5" />{sucessoAuth}</div>}

                {viewAuth === 'login' ? (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <Field label="E-mail profissional">
                      <input required type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} placeholder="ex: gestor@aasj.com" className={inputCls} />
                    </Field>
                    <Field label="Senha">
                      <input required type="password" value={loginSenha} onChange={e => setLoginSenha(e.target.value)} placeholder="••••••••" className={inputCls} />
                    </Field>
                    <Btn type="submit" size="lg" className="w-full !mt-6" icon="log-in">Acessar sistema</Btn>
                    <p className="text-center text-sm text-slate-500 pt-4">
                      É Supervisor N3?{' '}
                      <button type="button" onClick={() => trocarView('cadastro')} className="font-semibold text-brand-600 hover:text-brand-700 hover:underline underline-offset-4">Solicitar cadastro</button>
                    </p>
                  </form>
                ) : (
                  <form onSubmit={handleSolicitarCadastro} className="space-y-3.5">
                    <Field label="Nome completo"><input required type="text" value={novoCadastro.nome} onChange={e=>setNovoCadastro({...novoCadastro, nome: e.target.value})} className={inputCls} placeholder="Ex: Carlos Silva"/></Field>
                    <Field label="E-mail corporativo"><input required type="email" value={novoCadastro.email} onChange={e=>setNovoCadastro({...novoCadastro, email: e.target.value})} className={inputCls} placeholder="carlos@email.com"/></Field>
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="Registro IRATA (N3)"><input required type="text" value={novoCadastro.registro} onChange={e=>setNovoCadastro({...novoCadastro, registro: e.target.value})} className={inputCls + " font-mono"} placeholder="IRATA-XXXXX"/></Field>
                      <Field label="Validade IRATA"><input required type="date" value={novoCadastro.validadeIrata} onChange={e=>setNovoCadastro({...novoCadastro, validadeIrata: e.target.value})} className={inputCls}/></Field>
                    </div>
                    <Field label="Senha de acesso"><input required type="password" value={novoCadastro.senha} onChange={e=>setNovoCadastro({...novoCadastro, senha: e.target.value})} className={inputCls} placeholder="••••••••"/></Field>
                    <Btn type="submit" size="lg" className="w-full !mt-6" icon="send">Enviar solicitação</Btn>
                    <button type="button" onClick={() => trocarView('login')} className="w-full flex items-center justify-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 pt-3">
                      <Icon name="arrow-left" className="w-4 h-4" /> Voltar ao login
                    </button>
                  </form>
                )}
              </div>
            </div>
          </div>
        );
      }

      /* ---------- APLICAÇÃO LOGADA ---------- */
      const isGestor = usuarioLogado.perfil === 'GESTOR';
      const pendentes = usuariosCadastrados.filter(u => u.status === 'PENDENTE');
      const emQuarentena = equipamentos.filter(e => e.status === 'QUARENTENA');

      // Navegação enxuta: poucas seções no menu; cada seção alterna seus documentos por uma barra interna
      const secoes = isGestor ? [
        { id: 'painel', icon: 'layout-dashboard', label: 'Painel', tabs: ['painel'] },
        { id: 'documentos', icon: 'folder-open', label: 'Documentos N3', tabs: ['fo45', 'cl01', 'fo41'] },
        { id: 'equipamentos', icon: 'shield-alert', label: 'Equipamentos', tabs: ['auditoria', 'quarentena', 'inv'], count: danosReports.filter(d => ['reportado', 'ciente', 'troca_aprovada', 'inspecao'].includes(d.etapa)).length, tone: 'rose' },
        { id: 'equipe', icon: 'users', label: 'Equipe e unidades', tabs: ['autorizacoes', 'unidades'], count: pendentes.length, tone: 'amber' },
      ] : [
        { id: 'documentos', icon: 'folder-open', label: 'Documentos N3', tabs: ['fo45', 'cl01', 'fo41'] },
        { id: 'equipamentos', icon: 'wrench', label: 'Equipamentos', tabs: ['rl32', 'fo48', 'inv'], count: danosReports.filter(d => d.supervisorN3 === usuarioLogado.nome && d.etapa === 'enviado').length, tone: 'violet' },
      ];
      const secaoAtual = secoes.find(s => s.tabs.includes(activeTab)) || secoes[0];
      const rotulosAbas = {
        fo45: 'Horas · FO-45', cl01: 'Checklist · CL-01', fo41: 'Avaliação · FO-41',
        quarentena: 'Quarentenas', auditoria: 'Danos e trocas',
        autorizacoes: 'Aprovações', unidades: 'Unidades',
        fo48: 'Custódia EPI', inv: 'Inventário', rl32: 'Danos e trocas',
      };
      const danosSemCiencia = danosReports.filter(d => !d.ciente);
      const casosGestor = danosReports.filter(d => ['reportado', 'ciente', 'troca_aprovada', 'inspecao'].includes(d.etapa));
      const casosParados = casosGestor.filter(d => d.urgencia === 'parada');
      const contagemAba = { quarentena: emQuarentena.length, autorizacoes: pendentes.length, auditoria: isGestor ? casosGestor.length : 0, rl32: isGestor ? 0 : danosReports.filter(d => d.supervisorN3 === usuarioLogado.nome && d.etapa === 'enviado').length };
      const minhasNotificacoes = notificacoes.filter(n => isGestor ? n.para === 'GESTOR' : n.para === usuarioLogado.nome);
      const naoLidas = minhasNotificacoes.filter(n => !n.lida).length;
      const fmtDataHora = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
      const marcarLida = (id) => setNotificacoes(prev => prev.map(n => n.id === id ? { ...n, lida: true } : n));
      const marcarTodasLidas = () => setNotificacoes(prev => prev.map(n => minhasNotificacoes.some(m => m.id === n.id) ? { ...n, lida: true } : n));
      const abrirNotificacao = (n) => { marcarLida(n.id); setNotifAberto(false); setActiveTab(isGestor ? 'auditoria' : 'rl32'); setMenuAberto(false); };

      const paginas = {
        'painel': ['Painel', 'Horas, checklists e avaliações dos Supervisores N3, por unidade e por supervisor.'],
        'autorizacoes': ['Aprovações', 'Aprove ou rejeite solicitações de cadastro de Supervisores N3.'],
        'unidades': ['Unidades', 'Plataformas disponíveis para os supervisores indicarem nos documentos.'],
        'quarentena': ['Quarentenas', 'Equipamentos isolados aguardando liberação.'],
        'auditoria': ['Danos e trocas', 'Casos de dano (RL-32): ciência, decisão, envio do substituto e recebimento. Entregas de EPI (FO-48) ao lado.'],
        'fo45': ['Logbook de Horas em Corda (FO-45)', `Apontamento diário de horas com acesso (corda) e sem acesso. Limites anti-fadiga: ${LIMITE_HORAS_DIA}h com acesso e ${LIMITE_TOTAL_DIA}h no total por dia.`],
        'cl01': ['Checklist Diário e PTs (CL-01)', 'Checklist diário com verificação de Permissão de Trabalho (PT), APR e Rescatista.'],
        'fo48': ['Controle de Custódia de EPIs (FO-48)', 'Controle de custódia e retirada de kits de equipamentos.'],
        'rl32': ['Danos e trocas (RL-32)', 'Ao reportar, o equipamento vai para quarentena e o gestor é notificado. Acompanhe aqui até a troca chegar.'],
        'fo41': ['Avaliação Comportamental (FO-41)', 'Avaliação comportamental e de desempenho dos escaladores, em 10 critérios.'],
        'inv': ['Inventário por unidade', 'TAGs de cada unidade e seu status operacional. Escolha uma unidade para ver só o inventário dela.'],
      };
      const tituloPagina = secaoAtual.label;
      const descPagina = (paginas[activeTab] || ['', ''])[1];

      const acoes = isGestor ? {
        inv: { label: 'Adicionar TAG', icon: 'plus', onClick: abrirNovoInv },
      } : {
        fo45: { label: 'Adicionar colaborador', icon: 'user-plus', onClick: abrirNovoFO45 },
        cl01: { label: 'Novo checklist', icon: 'plus', onClick: abrirNovoCL01 },
        fo48: { label: 'Registrar retirada', icon: 'plus', onClick: () => setShowModalFO48(true) },
        rl32: { label: 'Reportar dano', icon: 'alert-triangle', variant: 'danger', onClick: () => setShowModalRL32(true) },
        fo41: { label: 'Nova avaliação', icon: 'plus', onClick: abrirNovoFO41 },
        inv: { label: 'Adicionar TAG', icon: 'plus', onClick: abrirNovoInv },
      };
      const acao = acoes[activeTab];

      const irPara = (id) => { setActiveTab(id); setMenuAberto(false); };

      // Estado lido pelos atalhos globais. "camadas" = o que o Esc fecha, do mais alto para o mais baixo.
      atalhosRef.current = {
        logado: true, secoes, irPara,
        alternarNotif: () => setNotifAberto(v => !v),
        camadas: [
          [!!fotoAmpliada, () => setFotoAmpliada('')],
          [ajudaTeclado, () => setAjudaTeclado(false)],
          [!!modalColab, () => setModalColab(null)],
          [!!decisao, () => setDecisao(null)],
          [showModalFO45, () => setShowModalFO45(false)],
          [showModalCL01, () => setShowModalCL01(false)],
          [showModalFO41, () => setShowModalFO41(false)],
          [showModalFO48, () => setShowModalFO48(false)],
          [showModalRL32, () => setShowModalRL32(false)],
          [showModalInv, () => setShowModalInv(false)],
          [notifAberto, () => setNotifAberto(false)],
          [menuAberto, () => setMenuAberto(false)],
        ],
      };

      // Setas ↑/↓ (e Home/End) entre os itens do menu lateral
      const navegarMenu = (e) => {
        if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) return;
        const itens = [...e.currentTarget.querySelectorAll('button[data-nav]')];
        const i = itens.indexOf(document.activeElement);
        const prox = e.key === 'Home' ? 0 : e.key === 'End' ? itens.length - 1 : (i + (e.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length;
        e.preventDefault(); itens[prox]?.focus();
      };

      // Setas ←/→ entre as abas internas da seção (padrão de "tablist")
      const navegarAbas = (e) => {
        if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return;
        const abas = secaoAtual.tabs;
        const i = abas.indexOf(activeTab);
        const prox = e.key === 'Home' ? 0 : e.key === 'End' ? abas.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
        e.preventDefault(); setActiveTab(abas[prox]);
        setTimeout(() => document.querySelector(`[data-aba="${abas[prox]}"]`)?.focus(), 0);
      };

      // Grade de horas: setas movem entre os campos (pulando dias bloqueados), Enter desce e Shift+Enter sobe
      const navegarGrade = (e) => {
        const el = e.target;
        const mapa = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowDown: [1, 0], ArrowUp: [-1, 0], Enter: [e.shiftKey ? -1 : 1, 0] };
        const passo = mapa[e.key];
        if (!passo || el.dataset.linha === undefined) return;
        e.preventDefault(); // evita que ↑/↓ alterem o número no campo
        let lin = Number(el.dataset.linha), col = Number(el.dataset.coluna);
        const maxLin = Number(el.dataset.maxLinha), maxCol = Number(el.dataset.maxColuna);
        for (let n = 0; n < 200; n++) {
          lin += passo[0]; col += passo[1];
          if (lin < 0 || lin > maxLin || col < 0 || col > maxCol) return;
          const alvo = document.querySelector(`[data-grade="fo45"][data-linha="${lin}"][data-coluna="${col}"]`);
          if (alvo && !alvo.disabled) { alvo.focus(); alvo.select?.(); alvo.scrollIntoView({ block: 'nearest', inline: 'nearest' }); return; }
        }
      };

      // Indicadores dos documentos N3 de um supervisor (ou de todos, quando nome = '')
      const statsSupervisor = (nome) => {
        const doSup = (item) => (!nome || item.supervisorN3 === nome) && (!filtroUnidade || item.unidade === filtroUnidade);
        const lbs = logbooks.filter(doSup), cls = checklistsKits.filter(doSup), avs = avaliacoes.filter(doSup);
        const datas = datasDosLogbooks(lbs);
        const horasDia = datas.map(iso => lbs.reduce((a, lb) => a + ((lb.horas || {})[iso] || 0), 0));
        const horas = horasDia.reduce((a, b) => a + b, 0);
        const conf = cls.length ? Math.round(cls.reduce((a, c) => a + conformidadeCL(c).pct, 0) / cls.length) : null;
        const media = avs.length ? Math.round(avs.reduce((a, av) => a + av.soma, 0) / avs.length) : null;
        const mediaCriterios = CRITERIOS_FO41.map((_, i) => avs.filter(a => a.notas).length ? avs.filter(a => a.notas).reduce((s, a) => s + Number(a.notas[i] || 0), 0) / avs.filter(a => a.notas).length : 0);
        const horasSem = lbs.reduce((a, lb) => a + horasSemLogbook(lb), 0);
        return { lbs, cls, avs, datas, horasDia, horas, horasSem, conf, media, mediaCriterios, colaboradores: new Set(lbs.map(l => l.colaborador)).size };
      };

      // Filtros compactos do gestor: duas listas suspensas (unidade e supervisor)
      const FiltroSelect = ({ icon, value, onChange, children, label }) => (
        <label className={`relative inline-flex items-center h-9 rounded-lg border text-sm transition ${value
          ? 'border-brand-300 bg-brand-50 text-brand-700 dark:border-brand-500/40 dark:bg-brand-500/10 dark:text-brand-300'
          : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300'}`}>
          <span className="absolute left-2.5 pointer-events-none opacity-70"><Icon name={icon} className="w-3.5 h-3.5" /></span>
          <select aria-label={label} value={value} onChange={e => onChange(e.target.value)} className="appearance-none bg-transparent h-full pl-8 pr-7 font-medium cursor-pointer focus:outline-none rounded-lg max-w-[220px]">
            {children}
          </select>
          <span className="absolute right-2 pointer-events-none opacity-60"><Icon name="chevron-down" className="w-3.5 h-3.5" /></span>
        </label>
      );
      const temFiltro = filtroUnidade || filtroDashboardSupervisor;
      const renderFiltros = () => isGestor && ['painel', 'documentos'].includes(secaoAtual.id) && (
        <div className="flex flex-wrap items-center gap-2 print-hidden">
          {FiltroSelect({ icon: 'anchor', label: 'Filtrar por unidade', value: filtroUnidade, onChange: setFiltroUnidade, children: [
            <option key="" value="">Todas as unidades</option>, ...unidades.map(u => <option key={u} value={u}>{u}</option>)] })}
          {FiltroSelect({ icon: 'user', label: 'Filtrar por supervisor', value: filtroDashboardSupervisor, onChange: setFiltroDashboardSupervisor, children: [
            <option key="" value="">Todos os supervisores</option>, ...supervisoresN3List.map(s => <option key={s.id} value={s.nome}>{s.nome}</option>)] })}
          {temFiltro && (
            <button onClick={() => { setFiltroUnidade(''); setFiltroDashboardSupervisor(''); }} className="h-9 px-2.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-white inline-flex items-center gap-1 transition">
              <Icon name="x" className="w-3.5 h-3.5" />Limpar
            </button>
          )}
        </div>
      );

      // Barra interna da seção (alterna os documentos sem precisar de várias abas no menu)
      const renderAbasSecao = () => secaoAtual.tabs.length > 1 && (
        <div role="tablist" aria-label={secaoAtual.label} onKeyDown={navegarAbas} className="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800 overflow-x-auto max-w-full print-hidden">
          {secaoAtual.tabs.map(t => (
            <button key={t} onClick={() => setActiveTab(t)} role="tab" aria-selected={activeTab === t} tabIndex={activeTab === t ? 0 : -1} data-aba={t}
              className={`shrink-0 inline-flex items-center gap-1.5 h-8 px-3.5 rounded-lg text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 ${activeTab === t
                ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm'
                : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'}`}>
              {rotulosAbas[t]}
              {contagemAba[t] > 0 && <span className="min-w-[18px] h-[18px] px-1 grid place-items-center rounded-full bg-red-500 text-white text-[10px] font-bold">{contagemAba[t]}</span>}
            </button>
          ))}
        </div>
      );

      // Cartão de um caso de dano (usado pelo gestor e pelo supervisor)
      const renderCasoDano = (d) => {
        const [etapaLabel, etapaTone] = ETAPAS_DANO[d.etapa] || ETAPAS_DANO.reportado;
        const urg = URGENCIAS[d.urgencia] || URGENCIAS.normal;
        const mostraPassos = d.acao === 'substituir' || d.substituto;
        const passo = passoTroca(d);
        const encerradoSemTroca = d.etapa === 'encerrado' && d.resultado !== 'Substituído';
        const hist = d.historico || [];
        const aberto = !!historicoAberto[d.id];
        return (
          <Card key={d.id} className={`p-5 ${d.etapa !== 'encerrado' && d.urgencia === 'parada' ? 'ring-2 ring-red-500/40' : ''}`}>
            <div className="flex flex-col sm:flex-row gap-4">
              {d.foto
                ? <button type="button" onClick={() => setFotoAmpliada(d.foto)} className="shrink-0 w-20 h-20 rounded-xl overflow-hidden ring-1 ring-slate-200 dark:ring-slate-700 hover:opacity-90" title="Ampliar foto"><img src={d.foto} alt="Foto da avaria" className="w-full h-full object-cover" /></button>
                : <div className="shrink-0 w-12 h-12 rounded-xl grid place-items-center bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400"><Icon name="alert-triangle" className="w-5 h-5" /></div>}
              <div className="flex-1 min-w-0">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="font-mono font-semibold text-sm text-slate-900 dark:text-white">{d.equipamentoTag}</span>
                  {d.equipamento && <span className="text-sm text-slate-500">{d.equipamento}{d.kit ? ` · Kit ${d.kit}` : ''}</span>}
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  <Badge tone={etapaTone} dot>{d.etapa === 'encerrado' ? `Encerrado · ${d.resultado}` : etapaLabel}</Badge>
                  {d.etapa !== 'encerrado' && <Badge tone={urg[1]}>{d.urgencia === 'parada' && <Icon name="alert-octagon" className="w-3 h-3" />}{urg[0]}</Badge>}
                  <Badge tone="slate">{ACOES_DANO[d.acao] || 'Apenas registro'}</Badge>
                </div>
                <p className="text-sm text-slate-700 dark:text-slate-300 mt-2">{d.falha}</p>
                <p className="text-xs text-slate-400 mt-1">{isGestor ? `${d.supervisorN3} · ` : ''}Reportado em {fmtDataHora(d.reportadoEm) || d.data}</p>

                {d.substituto && (
                  <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs rounded-lg bg-indigo-50/60 dark:bg-indigo-500/10 px-3 py-2 text-indigo-900 dark:text-indigo-200">
                    <span className="inline-flex items-center gap-1.5 font-semibold"><Icon name="repeat" className="w-3.5 h-3.5" />Substituto: {d.substituto.equipamento} <span className="font-mono">{d.substituto.tag}</span></span>
                    {d.substituto.previsao && <span>Previsão: {d.substituto.previsao}</span>}
                  </div>
                )}
                {d.obsGestor && <p className="mt-2 text-xs text-slate-600 dark:text-slate-400 border-l-2 border-slate-200 dark:border-slate-700 pl-2">Gestor: {d.obsGestor}</p>}

                {/* Etapas da troca */}
                {mostraPassos && !encerradoSemTroca && (
                  <ol className="mt-4 flex items-center">
                    {PASSOS_TROCA.map((p, i) => (
                      <li key={p} className={`flex items-center ${i < PASSOS_TROCA.length - 1 ? 'flex-1' : ''}`}>
                        <div className="flex flex-col items-center gap-1">
                          <span className={`w-6 h-6 rounded-full grid place-items-center text-[10px] font-bold ${i < passo || (i === passo && d.etapa === 'encerrado') ? 'bg-green-500 text-white' : i === passo ? 'bg-brand-600 text-white ring-4 ring-brand-500/20' : 'bg-slate-100 text-slate-400 dark:bg-slate-800'}`}>
                            {i < passo || (i === passo && d.etapa === 'encerrado') ? <Icon name="check" className="w-3.5 h-3.5" /> : i + 1}
                          </span>
                          <span className={`text-[10px] whitespace-nowrap ${i <= passo ? 'text-slate-700 dark:text-slate-200 font-semibold' : 'text-slate-400'}`}>{p}</span>
                        </div>
                        {i < PASSOS_TROCA.length - 1 && <span className={`flex-1 h-0.5 mx-1 mb-4 rounded ${i < passo ? 'bg-green-500' : 'bg-slate-200 dark:bg-slate-700'}`}></span>}
                      </li>
                    ))}
                  </ol>
                )}

                {/* Ações conforme perfil e etapa */}
                <div className="mt-4 flex flex-wrap gap-2">
                  {isGestor && d.etapa === 'reportado' && <Btn size="sm" variant="outline" icon="check" onClick={() => confirmarCiencia(d.id)}>Ok, ciente</Btn>}
                  {isGestor && ['reportado', 'ciente'].includes(d.etapa) && <Btn size="sm" icon="gavel" onClick={() => abrirDecisao(d)}>Decidir</Btn>}
                  {isGestor && d.etapa === 'troca_aprovada' && <Btn size="sm" icon="truck" onClick={() => marcarEnviado(d)}>Marcar como enviado</Btn>}
                  {isGestor && d.etapa === 'inspecao' && <>
                    <Btn size="sm" variant="soft" icon="badge-check" onClick={() => liberarAposInspecao(d)}>Aprovado · liberar</Btn>
                    <Btn size="sm" variant="outline" icon="repeat" onClick={() => abrirDecisao(d, 'troca')}>Reprovado · aprovar troca</Btn>
                    <Btn size="sm" variant="softDanger" icon="ban" onClick={() => abrirDecisao(d, 'condenar')}>Condenar</Btn>
                  </>}
                  {!isGestor && d.etapa === 'enviado' && <Btn size="sm" icon="package-check" onClick={() => confirmarRecebimento(d)}>Confirmar recebimento do substituto</Btn>}
                  {!isGestor && d.etapa === 'troca_aprovada' && <span className="text-xs text-slate-500 inline-flex items-center gap-1.5"><Icon name="clock" className="w-3.5 h-3.5" />Aguardando o gestor enviar o substituto</span>}
                  {hist.length > 0 && (
                    <button type="button" onClick={() => setHistoricoAberto({ ...historicoAberto, [d.id]: !aberto })} className="ml-auto inline-flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
                      <Icon name="history" className="w-3.5 h-3.5" />Histórico ({hist.length})<Icon name={aberto ? 'chevron-up' : 'chevron-down'} className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>

                {aberto && (
                  <ol className="mt-3 border-l-2 border-slate-200 dark:border-slate-700 ml-1.5 space-y-3 anim-fade">
                    {hist.map((h, i) => (
                      <li key={i} className="relative pl-4">
                        <span className="absolute -left-[5px] top-1.5 w-2 h-2 rounded-full bg-brand-500"></span>
                        <p className="text-xs font-semibold text-slate-800 dark:text-slate-200">{h.evento} <span className="font-normal text-slate-400">· {fmtDataHora(h.quando)} · {h.quem}</span></p>
                        {h.detalhe && <p className="text-xs text-slate-500 mt-0.5">{h.detalhe}</p>}
                      </li>
                    ))}
                  </ol>
                )}
              </div>
            </div>
          </Card>
        );
      };
      const ordemCaso = (d) => (d.etapa === 'encerrado' ? 10 : 0) + ({ parada: 0, urgente: 1, normal: 2 }[d.urgencia] ?? 2);
      const ordenarCasos = (lista) => [...lista].sort((a, b) => ordemCaso(a) - ordemCaso(b) || b.id - a.id);

      // Ações de edição por linha (somente supervisor)
      const renderAcoesLinha = (onEdit, onDelete, extra) => !isGestor && (
        <div className="flex items-center justify-end gap-1">
          {extra}
          <button type="button" onClick={onEdit} title="Editar" className="p-2 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition"><Icon name="pencil" className="w-4 h-4" /></button>
          <button type="button" onClick={onDelete} title="Excluir" className="p-2 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10 transition"><Icon name="trash-2" className="w-4 h-4" /></button>
        </div>
      );

      const renderNavItem = (item) => {
        const ativo = secaoAtual.id === item.id;
        return (
          <button key={item.id} onClick={() => irPara(item.tabs[0])} data-nav data-nav-ativo={ativo ? 'true' : undefined} aria-current={ativo ? 'page' : undefined}
            title={`${item.label} (Alt+${secoes.indexOf(item) + 1})`}
            className={`group w-full flex items-center gap-3 px-3 h-10 rounded-xl text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 ${ativo
              ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-300'
              : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 hover:text-slate-900 dark:hover:bg-slate-800/70 dark:hover:text-white'}`}>
            <Icon name={item.icon} className={`w-[18px] h-[18px] ${ativo ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300'}`} />
            <span className="flex-1 text-left truncate">{item.label}</span>
            {item.count > 0 && <Badge tone={item.tone}>{item.count}</Badge>}
            <kbd className="hidden lg:inline text-[10px] font-mono text-slate-300 dark:text-slate-600 group-hover:text-slate-400">Alt {secoes.indexOf(item) + 1}</kbd>
          </button>
        );
      };

      const renderSidebar = () => (
        <div className="h-full flex flex-col bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800">
          <div className="h-16 flex items-center gap-3 px-5 border-b border-slate-100 dark:border-slate-800">
            <div className="min-w-0 rounded-lg dark:bg-white dark:px-2 dark:py-1">
              <img src="assets/logo-horizontal.png" alt="TechOcean | AASJ Serviços Industriais" className="h-10 w-auto max-w-full object-contain" />
            </div>
            <button onClick={() => setMenuAberto(false)} className="lg:hidden ml-auto p-2 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Fechar menu">
              <Icon name="x" className="w-5 h-5" />
            </button>
          </div>

          <nav className="flex-1 overflow-y-auto p-3 pt-4 space-y-0.5" onKeyDown={navegarMenu} aria-label="Menu principal">
            {secoes.map(renderNavItem)}
          </nav>

          <div className="p-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
            <div className="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50">
              <Avatar nome={usuarioLogado.nome} size="sm" />
              <div className="min-w-0 flex-1">
                <p className="text-sm font-semibold truncate text-slate-900 dark:text-white">{usuarioLogado.nome}</p>
                <p className="text-[11px] font-medium text-brand-600 dark:text-brand-400">{isGestor ? 'Gestor Master' : 'Supervisor N3'}</p>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Btn variant="ghost" size="sm" icon={darkMode ? 'sun' : 'moon'} onClick={() => setDarkMode(!darkMode)}>{darkMode ? 'Claro' : 'Escuro'}</Btn>
              <Btn variant="softDanger" size="sm" icon="log-out" onClick={() => { setNotifAberto(false); setUsuarioLogado(null); }}>Sair</Btn>
            </div>
          </div>
        </div>
      );

      const nomesColab = (lista) => lista.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>);

      const abrirNovoColab = (onCriado, permitirN3 = false) => { setNovoColab(novoColabVazio); setErroColab(''); setModalColab({ onCriado, permitirN3 }); };
      const salvarNovoColab = (e) => {
        e.preventDefault();
        const nome = novoColab.nome.trim().replace(/\s+/g, ' ');
        const registro = novoColab.registro.trim().toUpperCase();
        if (colaboradores.some(c => c.nome.toLowerCase() === nome.toLowerCase())) { setErroColab(`${nome} já está cadastrado.`); return; }
        if (colaboradores.some(c => c.registro.toUpperCase() === registro)) { setErroColab(`O registro ${registro} já pertence a outro colaborador.`); return; }
        const colab = { id: Date.now(), nome, nivel: novoColab.nivel, funcao: novoColab.funcao.trim() || 'Escalador', registro, validadeIrata: novoColab.validadeIrata, statusCert: 'Regular', cadastradoPor: usuarioLogado.nome };
        setColaboradores([...colaboradores, colab]);
        modalColab?.onCriado?.(colab.nome);
        setModalColab(null);
      };
      // Link "+ Cadastrar novo colaborador" exibido abaixo das listas de colaboradores
      const renderLinkNovoColab = (onCriado, permitirN3 = false) => (
        <button type="button" onClick={() => abrirNovoColab(onCriado, permitirN3)} className="mt-1.5 inline-flex items-center gap-1 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline underline-offset-4">
          <Icon name="user-plus" className="w-3.5 h-3.5" />Não está na lista? Cadastrar novo colaborador
        </button>
      );

      return (
        <div className="min-h-screen lg:pl-64">

          {/* SIDEBAR DESKTOP */}
          <aside className="hidden lg:block fixed inset-y-0 left-0 w-64 z-30 print-hidden">{renderSidebar()}</aside>

          {/* SIDEBAR MOBILE (GAVETA) */}
          {menuAberto && (
            <div className="lg:hidden fixed inset-0 z-40 print-hidden">
              <div className="absolute inset-0 bg-slate-950/50 backdrop-blur-sm anim-fade" onClick={() => setMenuAberto(false)}></div>
              <aside className="absolute inset-y-0 left-0 w-72 max-w-[85vw] shadow-2xl anim-slide">{renderSidebar()}</aside>
            </div>
          )}

          {/* TOPO */}
          <header className="sticky top-0 z-20 h-16 flex items-center gap-3 px-4 sm:px-6 lg:px-8 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800 print-hidden">
            <button onClick={() => setMenuAberto(true)} className="lg:hidden p-2 -ml-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Abrir menu">
              <Icon name="menu" className="w-5 h-5" />
            </button>
            <div className="relative flex-1 max-w-sm">
              <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><Icon name="search" className="w-4 h-4" /></span>
              <input id="busca-global" type="text" placeholder="Buscar no sistema...  ( / )" className="w-full h-10 pl-9 pr-3 bg-slate-100/80 dark:bg-slate-900 border border-transparent rounded-xl text-sm placeholder:text-slate-400 focus:outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition" />
            </div>
            <div className="ml-auto flex items-center gap-2">
              <div className="hidden md:flex items-center gap-1.5">
                <Badge tone="slate"><Icon name="building-2" className="w-3 h-3" /> {campanha.cliente}</Badge>
                <Badge tone="emerald"><Icon name="anchor" className="w-3 h-3" /> {isGestor ? (filtroUnidade || 'Todas as unidades') : campanha.unidade}</Badge>
              </div>
              <button onClick={() => setAjudaTeclado(true)} title="Atalhos de teclado ( ? )" aria-label="Atalhos de teclado" className="hidden md:grid h-10 w-10 place-items-center rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500">
                <Icon name="keyboard" className="w-5 h-5" />
              </button>
              {/* Sino de notificações */}
              <div className="relative">
                <button onClick={() => setNotifAberto(!notifAberto)} aria-label={`Notificações${naoLidas ? ` (${naoLidas} não lidas)` : ''}`}
                  className={`relative h-10 w-10 grid place-items-center rounded-xl border transition ${notifAberto ? 'bg-slate-100 border-slate-200 dark:bg-slate-800 dark:border-slate-700' : 'border-transparent hover:bg-slate-100 dark:hover:bg-slate-800'} text-slate-600 dark:text-slate-300`}>
                  <Icon name="bell" className="w-5 h-5" />
                  {naoLidas > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 grid place-items-center rounded-full bg-red-600 text-white text-[10px] font-bold ring-2 ring-white dark:ring-slate-950">
                      {naoLidas}
                    </span>
                  )}
                </button>
                {notifAberto && (<>
                  <div className="fixed inset-0 z-30" onClick={() => setNotifAberto(false)}></div>
                  <div className="absolute right-0 top-12 z-40 w-[380px] max-w-[calc(100vw-2rem)] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl anim-pop overflow-hidden">
                    <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-800">
                      <p className="font-semibold text-sm text-slate-900 dark:text-white">Notificações</p>
                      {naoLidas > 0 && <button onClick={marcarTodasLidas} className="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline">Marcar todas como lidas</button>}
                    </div>
                    {minhasNotificacoes.length === 0 ? (
                      <EmptyState icon="bell-off" title="Nenhuma notificação" text={isGestor ? 'Reportes de danos aparecem aqui.' : 'Confirmações do gestor aparecem aqui.'} />
                    ) : (
                      <ul className="max-h-[420px] overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800">
                        {minhasNotificacoes.map(n => {
                          const dano = danosReports.find(d => d.id === n.danoId);
                          const pendente = isGestor && n.tipo === 'dano' && dano && !dano.ciente;
                          return (
                            <li key={n.id} className={`px-4 py-3 flex gap-3 ${n.lida ? '' : 'bg-brand-50/50 dark:bg-brand-500/5'}`}>
                              <div className={`mt-0.5 p-2 h-fit rounded-lg ${n.tipo === 'dano' ? 'bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400' : 'bg-green-50 text-green-600 dark:bg-green-500/10 dark:text-green-400'}`}>
                                <Icon name={n.tipo === 'dano' ? 'alert-triangle' : 'check-circle-2'} className="w-4 h-4" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <button onClick={() => abrirNotificacao(n)} className="text-left w-full">
                                  <p className="text-sm font-semibold text-slate-900 dark:text-white flex items-center gap-2">{n.titulo}{!n.lida && <span className="w-2 h-2 rounded-full bg-brand-500 shrink-0"></span>}</p>
                                  <p className="text-xs text-slate-600 dark:text-slate-400 mt-0.5">{n.texto}</p>
                                  <p className="text-[11px] text-slate-400 mt-1">{fmtDataHora(n.data)}</p>
                                </button>
                                {pendente && <Btn size="sm" icon="check" className="mt-2" onClick={() => confirmarCiencia(n.danoId)}>Ok, ciente</Btn>}
                                {isGestor && n.tipo === 'dano' && dano?.ciente && <Badge tone="green" className="mt-2"><Icon name="check" className="w-3 h-3" />Ciência confirmada {fmtDataHora(dano.cienteEm)}</Badge>}
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    )}
                  </div>
                </>)}
              </div>
              <Btn size="md" icon="download" onClick={() => window.print()}><span className="hidden sm:inline">Exportar</span></Btn>
            </div>
          </header>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="px-4 sm:px-6 lg:px-8 py-6 lg:py-8 max-w-7xl">

            <div className="mb-5">
              <h2 className="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">{tituloPagina}</h2>
              <p className="text-sm text-slate-500 mt-1">{descPagina}</p>
            </div>
            {(secaoAtual.tabs.length > 1 || acao || (isGestor && ['painel', 'documentos'].includes(secaoAtual.id))) && (
              <div className="mb-5 flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div className="min-w-0">{renderAbasSecao()}</div>
                <div className="flex flex-wrap items-center gap-2 md:justify-end">
                  {renderFiltros()}
                  {acao && <Btn variant={acao.variant || 'primary'} icon={acao.icon} onClick={acao.onClick} className="shrink-0">{acao.label}</Btn>}
                </div>
              </div>
            )}

              <Modal title="Cadastrar novo colaborador" subtitle="Ele passa a aparecer em todos os formulários." icon="user-plus" onClose={() => setModalColab(null)}>
                <form onSubmit={salvarNovoColab} className="space-y-4">
                  <Field label="Nome completo"><input required autoFocus type="text" placeholder="Ex: Carlos Silva" value={novoColab.nome} onChange={e => { setNovoColab({ ...novoColab, nome: e.target.value }); setErroColab(''); }} className={inputCls} /></Field>
                  <div className="grid grid-cols-3 gap-3">
                    <Field label="Nível IRATA">
                      <select value={novoColab.nivel} onChange={e => setNovoColab({ ...novoColab, nivel: e.target.value })} className={inputCls}>
                        {(modalColab.permitirN3 ? ['N1', 'N2', 'N3'] : ['N1', 'N2']).map(n => <option key={n} value={n}>{n}</option>)}
                      </select>
                    </Field>
                    <div className="col-span-2"><Field label="Função"><input type="text" placeholder="Ex: Pintor Escadista" value={novoColab.funcao} onChange={e => setNovoColab({ ...novoColab, funcao: e.target.value })} className={inputCls} /></Field></div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Registro IRATA"><input required type="text" placeholder="IRATA-XXXXX" value={novoColab.registro} onChange={e => { setNovoColab({ ...novoColab, registro: e.target.value }); setErroColab(''); }} className={inputCls + " font-mono uppercase placeholder:normal-case"} /></Field>
                    <Field label="Validade da certificação"><input type="date" value={novoColab.validadeIrata} onChange={e => setNovoColab({ ...novoColab, validadeIrata: e.target.value })} className={inputCls} /></Field>
                  </div>
                  {erroColab && <p className="text-xs text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" className="w-3.5 h-3.5" />{erroColab}</p>}
                  <ModalActions onCancel={() => setModalColab(null)} submitLabel="Cadastrar e selecionar" />
                </form>
              </Modal>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
